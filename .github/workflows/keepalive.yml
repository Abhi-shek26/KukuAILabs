# Keeps a free Render instance from idling out.
#
# Render free web services sleep after 15 minutes without traffic; waking them takes ~40-50 s,
# which is exactly what a reviewer would hit on a cold link. A warm 24/7 service uses ~730 of
# the 750 free instance-hours per month, so pinging it stays inside the free plan.
#
# GitHub's scheduler can drift a few minutes, hence every 10 minutes rather than 14.
#
# One-time setup: Settings → Secrets and variables → Actions → Variables →
#   PROMO_APP_URL = https://promo-finder-mern.onrender.com      (no trailing slash)
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        env:
          APP_URL: ${{ vars.PROMO_APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Set the repository variable PROMO_APP_URL (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi
          start=$(date +%s%N)
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$APP_URL/api/health" || true)
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "GET $APP_URL/api/health -> $code in ${ms} ms"
          if [ "$code" != "200" ]; then
            echo "::error::health check failed with HTTP $code (a cold start can take ~50 s, the next run usually passes)"
            exit 1
          fi
